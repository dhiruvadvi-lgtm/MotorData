<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motor Winding Data</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <img src="logo.png" alt="Logo" class="logo">
  <div>
    <h1>Motor Winding Data</h1>
    <p>Motor   Save  Search </p>
  </div>
</header>

<div class="container">

  <div class="top-box">
    <h2> Saved Motors: <span id="motorCount">0</span></h2>
  </div>

  <!-- SEARCH -->
  <div class="card">
    <h2> Motor Search</h2>

    <input
      type="text"
      id="searchBox"
      placeholder="Stator, Golai, Rotor, Pitch, Turns, Wire, HP  search ..."
      oninput="searchMotors()"
    >

    <div id="searchResults"></div>
  </div>

  <!-- ADD MOTOR -->
  <div class="card">
    <h2>  Motor  </h2>

    <div class="grid">

      <div>
        <label>Motor Name</label>
        <input id="motor_name" type="text" placeholder=" 3 HP Motor">
      </div>

      <div>
        <label>HP</label>
        <input id="hp" type="text" placeholder=" 3 HP">
      </div>

      <div>
        <label>Voltage</label>
        <input id="voltage" type="text" placeholder=" 230V">
      </div>

      <div>
        <label>RPM</label>
        <input id="rpm" type="text" placeholder=" 1440">
      </div>

      <div>
        <label>Stator Length</label>
        <input id="stator_length" type="text" placeholder=" 80 mm">
      </div>

      <div>
        <label>Stator Golai</label>
        <input id="stator_golai" type="text" placeholder=" 100 mm">
      </div>

      <div>
        <label>Rotor Length</label>
        <input id="rotor_length" type="text" placeholder=" 75 mm">
      </div>

      <div>
        <label>Slot</label>
        <input id="slot" type="text" placeholder=" 24">
      </div>

      <div>
        <label>Pitch</label>
        <input id="pitch" type="text" placeholder=" 1-5">
      </div>

      <div>
        <label>Turns</label>
        <input id="turns" type="text" placeholder=" 80 Turns">
      </div>

      <div>
        <label>Wire</label>
        <input id="wire" type="text" placeholder=" 24 SWG">
      </div>

      <div>
        <label>Connection</label>
        <input id="connection" type="text" placeholder=" Star / Delta">
      </div>

    </div>

    <label>Coil Details</label>
    <textarea id="coil_details" placeholder="Coil    "></textarea>

    <label>Notes</label>
    <textarea id="notes" placeholder="  "></textarea>

    <button onclick="saveMotor()" id="saveBtn">
       Motor Save 
    </button>

    <p id="message"></p>
  </div>

  <!-- ALL DATA -->
  <div class="card">
    <div class="title-row">
      <h2>  Motor Data</h2>
      <button class="small-btn" onclick="loadMotors()"> Refresh</button>
    </div>

    <div id="motorList">
      Loading...
    </div>
  </div>

</div>

<footer>
  Motor Winding Data © 2026
</footer>


<script>

const SUPABASE_URL =
"https://sqljlammpfeohiswudmv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_0OcqH2qkGYF9U3vYtSZBMA_X0ryMcw2";


const headers = {
  "apikey": SUPABASE_KEY,
  "Content-Type": "application/json"
};


// =============================
// LOAD MOTOR DATA
// =============================

let allMotors = [];

async function loadMotors() {

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/motors?select=*&order=id.desc`,
      {
        method: "GET",
        headers: headers
      }
    );

    if (!response.ok) {
      throw new Error(await response.text());
    }

    allMotors = await response.json();

    document.getElementById("motorCount").innerText =
      allMotors.length;

    displayMotors(allMotors);

  } catch (error) {

    console.error(error);

    document.getElementById("motorList").innerHTML =
      `<div class="error"> Data load  </div>`;
  }
}


// =============================
// SAVE MOTOR
// =============================

async function saveMotor() {

  const btn = document.getElementById("saveBtn");
  const message = document.getElementById("message");

  const motor = {

    motor_name: getValue("motor_name"),
    hp: getValue("hp"),
    voltage: getValue("voltage"),
    rpm: getValue("rpm"),
    stator_length: getValue("stator_length"),
    stator_golai: getValue("stator_golai"),
    rotor_length: getValue("rotor_length"),
    slot: getValue("slot"),
    pitch: getValue("pitch"),
    turns: getValue("turns"),
    wire: getValue("wire"),
    connection: getValue("connection"),
    coil_details: getValue("coil_details"),
    notes: getValue("notes")

  };


  if (
    !motor.motor_name &&
    !motor.hp &&
    !motor.stator_length &&
    !motor.stator_golai
  ) {

    message.innerHTML =
      "    Motor Name  Motor    ";

    return;
  }


  btn.disabled = true;
  btn.innerText = " Saving...";


  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/motors`,
      {
        method: "POST",

        headers: {
          ...headers,
          "Prefer": "return=representation"
        },

        body: JSON.stringify(motor)
      }
    );


    if (!response.ok) {
      throw new Error(await response.text());
    }


    message.innerHTML =
      " Motor Data  Save  !";

    message.className = "success";


    clearForm();

    await loadMotors();


  } catch (error) {

    console.error(error);

    message.innerHTML =
      " Save  : " + error.message;

    message.className = "error";

  }


  btn.disabled = false;
  btn.innerText = " Motor Save ";
}


// =============================
// SEARCH
// =============================

function searchMotors() {

  const search =
    document.getElementById("searchBox")
    .value
    .trim()
    .toLowerCase();


  if (!search) {

    displayMotors(allMotors);

    return;
  }


  const results = allMotors.filter(motor => {

    return Object.values(motor)
      .join(" ")
      .toLowerCase()
      .includes(search);

  });


  displayMotors(results);
}


// =============================
// DISPLAY DATA
// =============================

function displayMotors(motors) {

  const box =
    document.getElementById("motorList");


  if (!motors.length) {

    box.innerHTML =
      `<div class="no-data">
          Motor Data  
      </div>`;

    return;
  }


  box.innerHTML = motors.map(motor => `

    <div class="motor-card">

      <div class="motor-title">
         ${escapeHTML(motor.motor_name || "Motor")}
      </div>

      <div class="data-grid">

        ${dataItem("HP", motor.hp)}
        ${dataItem("Voltage", motor.voltage)}
        ${dataItem("RPM", motor.rpm)}
        ${dataItem("Stator Length", motor.stator_length)}
        ${dataItem("Stator Golai", motor.stator_golai)}
        ${dataItem("Rotor Length", motor.rotor_length)}
        ${dataItem("Slot", motor.slot)}
        ${dataItem("Pitch", motor.pitch)}
        ${dataItem("Turns", motor.turns)}
        ${dataItem("Wire", motor.wire)}
        ${dataItem("Connection", motor.connection)}

      </div>

      ${
        motor.coil_details
        ? `<div class="extra">
            <b>Coil Details:</b><br>
            ${escapeHTML(motor.coil_details)}
           </div>`
        : ""
      }

      ${
        motor.notes
        ? `<div class="extra">
            <b>Notes:</b><br>
            ${escapeHTML(motor.notes)}
           </div>`
        : ""
      }

    </div>

  `).join("");
}


// =============================
// HELPER
// =============================

function getValue(id) {

  return document
    .getElementById(id)
    .value
    .trim();
}


function dataItem(label, value) {

  if (!value) return "";

  return `
    <div class="data-item">
      <span>${label}</span>
      <b>${escapeHTML(value)}</b>
    </div>
  `;
}


function escapeHTML(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function clearForm() {

  const ids = [
    "motor_name",
    "hp",
    "voltage",
    "rpm",
    "stator_length",
    "stator_golai",
    "rotor_length",
    "slot",
    "pitch",
    "turns",
    "wire",
    "connection",
    "coil_details",
    "notes"
  ];


  ids.forEach(id => {

    document.getElementById(id).value = "";

  });
}


// START
loadMotors();

</script>

</body>
</html>
