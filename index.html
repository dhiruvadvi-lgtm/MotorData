<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motor Winding Data</title><link rel="stylesheet" href="style.css">
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#222}header{display:flex;align-items:center;gap:12px;padding:14px;background:#171b24;color:white}.logo{width:56px;height:56px;object-fit:contain}main{max-width:1000px;margin:16px auto;padding:0 12px}.stats,.form-card,.saved-card{background:white;border-radius:12px;padding:15px;margin-bottom:15px}.stats{display:flex;gap:12px}.stat-box{display:flex;gap:10px;flex:1}.stat-icon{font-size:24px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}input,select,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #ccd1d8;border-radius:7px;font:inherit}textarea{min-height:75px}button{padding:10px 13px;margin:5px 4px 0 0;border:0;border-radius:7px;cursor:pointer;font:inherit}.save-btn,.delete-btn{background:#c62828;color:white}.clear-btn{background:#e8eaf0}.view-btn{background:#1976d2;color:white}.edit-btn{background:#ed9817;color:white}.motor-item{background:white;border:1px solid #ddd;border-radius:10px;padding:12px;margin-top:12px}.motor-title,.list-header{display:flex;justify-content:space-between;gap:12px}.motor-title h3{margin:0 0 5px}.quick-data,.details-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.quick-data>div,.details-grid>div{display:flex;flex-direction:column;padding:8px;background:#f6f7f9;border-radius:6px;overflow-wrap:anywhere}.search-box{display:flex;gap:8px;align-items:center}.empty{padding:20px;text-align:center}.popup{display:none;position:fixed;inset:0;background:#0009;z-index:99;align-items:center;justify-content:center;padding:12px}.popup-content{background:white;border-radius:12px;padding:18px;width:min(650px,100%);max-height:85vh;overflow:auto}.close{float:right}#statusMessage{padding:10px;margin:12px 0;border-radius:7px;background:#e8f3ff;overflow-wrap:anywhere}@media(max-width:600px){.form-grid{grid-template-columns:1fr}.stats,.list-header{flex-direction:column}.search-box{width:100%}}
</style></head><body>
<header><div class="logo-box"><img src="logo.png" alt="Logo" class="logo"></div><div class="header-text"><h1>Motor Winding Data</h1><p>Motor ka data save aur search kare</p></div></header>
<main><div id="statusMessage">Database se connect ho raha hai...</div>
<section class="stats"><div class="stat-box"><span class="stat-icon"></span><div>Total Motors<br><strong id="totalMotors">0</strong></div></div><div class="stat-box"><span class="stat-icon"></span><div>Search Result<br><strong id="searchCount">0</strong></div></div></section>
<section class="form-card"><h2> New Motor Data</h2><div class="form-grid">
<div class="field"><label>Motor Name / Customer</label><input id="motorName" placeholder="Example: 3 HP Motor"></div>
<div class="field"><label>HP</label><input id="hp" placeholder="Example: 3 HP"></div>
<div class="field"><label>Voltage</label><input id="voltage" placeholder="Example: 415V"></div>
<div class="field"><label>RPM</label><input id="rpm" placeholder="Example: 1440"></div>
<div class="field"><label>Stator Length</label><input id="statorLength" placeholder="Example: 100 mm"></div>
<div class="field"><label>Stator Golai</label><input id="statorGolai" placeholder="Example: 120 mm"></div>
<div class="field"><label>Rotor Length</label><input id="rotorLength" placeholder="Example: 95 mm"></div>
<div class="field"><label>Slot</label><input id="slot" placeholder="Example: 36"></div>
<div class="field"><label>Pitch</label><input id="pitch" placeholder="Example: 1-10"></div>
<div class="field"><label>Turns</label><input id="turns" placeholder="Example: 28"></div>
<div class="field"><label>Wire Size</label><input id="wire" placeholder="Example: 0.90 mm"></div>
<div class="field"><label>Connection Type</label><select id="connection"><option value="">Select Connection</option><option>Star</option><option>Delta</option><option>Star-Delta</option><option>Other</option></select></div>
<div class="field full"><label>Coil / Winding Details</label><textarea id="coilDetails" placeholder="Coil group, coil span, parallel wire etc."></textarea></div>
<div class="field full"><label>Extra Notes</label><textarea id="notes" placeholder="Koi bhi extra information..."></textarea></div>
</div><button id="saveButton" class="save-btn" onclick="saveMotor()"> Save Motor Data</button><button class="clear-btn" onclick="clearForm()">Clear</button></section>
<section class="saved-card"><div class="list-header"><div><h2> Saved Motors</h2><p>Name, HP, Stator Length, Pitch, Turns, Wire, Slot ya koi bhi data search kare.</p></div><div class="search-box"> <input id="search" type="search" placeholder="Search motor data..." oninput="showMotors()"></div></div><div id="motorList"></div></section></main>
<div id="detailsBox" class="popup"><div class="popup-content"><button class="close" onclick="closeDetails()">×</button><div id="details"></div></div></div>
<script>
const SUPABASE_URL="https://slqjlampmfeohiswudmv.supabase.co";
const SUPABASE_KEY="sb_publishable_0OcqH2qkGYF9U3vYtSZBMA_X0ryMcw2";
const TABLE_URL=SUPABASE_URL+"/rest/v1/motors";
const HEADERS={"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"};
const fields=[["motorName","motor_name"],["hp","hp"],["voltage","voltage"],["rpm","rpm"],["statorLength","stator_length"],["statorGolai","stator_golai"],["rotorLength","rotor_length"],["slot","slot"],["pitch","pitch"],["turns","turns"],["wire","wire"],["connection","connection"],["coilDetails","coil_details"],["notes","notes"]];
let motors=[],editId=null;
function status(t,bad=false){let e=document.getElementById("statusMessage");e.textContent=t;e.style.background=bad?"#ffebee":"#e8f3ff";e.style.color=bad?"#a31515":"#154a7a"}
async function api(path="",opts={}){let r=await fetch(TABLE_URL+path,{...opts,headers:{...HEADERS,...(opts.headers||{})}});let t=await r.text();if(!r.ok){let msg=t;try{let j=JSON.parse(t);msg=j.message||j.details||j.hint||t}catch(e){}throw Error("HTTP "+r.status+": "+msg)}return t?JSON.parse(t):[]}
function fromDB(r){let m={id:r.id,date:r.created_at?new Date(r.created_at).toLocaleDateString("en-IN"):""};fields.forEach(([a,b])=>m[a]=r[b]||"");return m}
function toDB(){let r={};fields.forEach(([a,b])=>r[b]=document.getElementById(a).value.trim());return r}
async function loadMotors(){try{motors=(await api("?select=*&order=id.desc")).map(fromDB);status(" Database connected. Online motor data loaded.");showMotors()}catch(e){status("Database load nahi hua: "+e.message,true);showMotors()}}
async function saveMotor(){let row=toDB();if(!row.motor_name&&!row.hp&&!row.stator_length){alert("Motor Name, HP ya Stator Length me se kuch data bhare.");return}let b=document.getElementById("saveButton");b.disabled=true;try{if(editId===null){await api("?select=*",{method:"POST",headers:{"Prefer":"return=representation"},body:JSON.stringify(row)});status(" Naya motor data Database mein save ho gaya.");alert("Motor data online save ho gaya!")}else{await api("?id=eq."+encodeURIComponent(editId),{method:"PATCH",headers:{"Prefer":"return=representation"},body:JSON.stringify(row)});editId=null;status(" Motor data update ho gaya.");alert("Motor data update ho gaya!")}clearForm();await loadMotors()}catch(e){status("Save/Update nahi hua: "+e.message,true);alert("Save/Update nahi hua:\n"+e.message)}finally{b.disabled=false}}
function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function showMotors(){let list=document.getElementById("motorList"),q=document.getElementById("search").value.trim().toLowerCase();list.innerHTML="";let found=motors.filter(m=>fields.some(([a])=>String(m[a]||"").toLowerCase().includes(q)));document.getElementById("totalMotors").textContent=motors.length;document.getElementById("searchCount").textContent=found.length;if(!found.length){list.innerHTML='<div class="empty"><p>'+(q?"Is search ka motor data nahi mila.":"Abhi Database mein koi motor data nahi hai.")+'</p></div>';return}found.forEach(m=>{let d=document.createElement("div");d.className="motor-item";let quick=[["Stator Length",m.statorLength],["Stator Golai",m.statorGolai],["Rotor Length",m.rotorLength],["Pitch",m.pitch],["Turns",m.turns],["Wire",m.wire],["Slot",m.slot],["RPM",m.rpm]];d.innerHTML='<div class="motor-title"><div><h3>'+esc(m.motorName||"Motor")+'</h3><span>'+esc(m.hp||"")+(m.connection?" • "+esc(m.connection):"")+'</span></div><small>'+esc(m.date)+'</small></div><div class="quick-data">'+quick.map(([a,v])=>'<div><b>'+a+'</b><span>'+esc(v||"-")+'</span></div>').join("")+'</div><div class="buttons"><button class="view-btn">View</button><button class="edit-btn">Edit</button><button class="delete-btn"> Delete</button></div>';let bs=d.querySelectorAll("button");bs[0].onclick=()=>viewMotor(m.id);bs[1].onclick=()=>editMotor(m.id);bs[2].onclick=()=>deleteMotor(m.id);list.append(d)})}
function viewMotor(id){let m=motors.find(x=>String(x.id)===String(id));if(!m)return;let det=fields.map(([a,b])=>'<div><b>'+esc(b.replaceAll("_"," "))+'</b><span>'+esc(m[a]||"-")+'</span></div>').join("");document.getElementById("details").innerHTML='<h2> '+esc(m.motorName||"Motor")+'</h2><div class="details-grid">'+det+'</div><p><b>Saved:</b> '+esc(m.date)+'</p>';document.getElementById("detailsBox").style.display="flex"}
function closeDetails(){document.getElementById("detailsBox").style.display="none"}
function editMotor(id){let m=motors.find(x=>String(x.id)===String(id));if(!m)return;fields.forEach(([a])=>document.getElementById(a).value=m[a]||"");editId=m.id;document.getElementById("saveButton").textContent=" Update Motor Data";window.scrollTo({top:0,behavior:"smooth"})}
async function deleteMotor(id){if(!confirm("Kya aap ye motor data Database se delete karna chahte ho?"))return;try{await api("?id=eq."+encodeURIComponent(id),{method:"DELETE"});status("Motor data delete ho gaya.");await loadMotors()}catch(e){status("Delete nahi hua: "+e.message,true);alert(e.message)}}
function clearForm(){fields.forEach(([a])=>document.getElementById(a).value="");editId=null;document.getElementById("saveButton").textContent=" Save Motor Data"}
loadMotors();
</script></body></html>
